[project]
name = "product-service-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.248.0,<3.0.0",
    "constructs>=10.5.0,<11.0.0",
    "aws-lambda-powertools[parser]>=3.28.0",
    "aws-cdk.aws-lambda-python-alpha==2.252.0a0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*" ]

[dependency-groups]
dev = [
    "moto[dynamodb, s3]>=5.0.0",
    "poethepoet>=0.46.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services"] 

[tool.poe]
envfile = ".env"

[tool.poe.tasks]
deploy = "cdk deploy --profile $PROFILE -c main_email=$MAIN_EMAIL -c different_email=$DIFERENT_EMAIL --require-approval never --verbose --method=direct"
synth = "cdk synth --profile $PROFILE -c main_email=$MAIN_EMAIL -c different_email=$DIFERENT_EMAIL --require-approval never --verbose --method=direct"
bootstrap = "cdk bootstrap --profile $PROFILE"
destroy = "cdk destroy --profile $PROFILE --force"
login = "aws login --profile $PROFILE"

lint = "uv run ruff check --fix ."
format = "uv run ruff format ."