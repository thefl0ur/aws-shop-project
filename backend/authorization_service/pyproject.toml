[project]
name = "auth-service-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.255.0,<3.0.0",
    "constructs>=10.5.0,<11.0.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*" ]

[dependency-groups]
dev = [
    "poethepoet>=0.46.0",
    "ruff>=0.15.12",
]

[tool.poe]
envfile = ".env"

[tool.poe.tasks]
deploy = "cdk deploy --profile $PROFILE -c test_user=$TEST_USER -c test_password=$TEST_PASSWORD --require-approval never --verbose --method=direct"
synth = "cdk synth --profile $PROFILE -c test_user=$TEST_USER -c test_password=$TEST_PASSWORD"
bootstrap = "cdk bootstrap --profile $PROFILE"
destroy = "cdk destroy --profile $PROFILE --force"
login = "aws login --profile $PROFILE"
lint = "uv run ruff check --fix ."
format = "uv run ruff format ."